<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${esEdicion ? 'Editar Producto' : 'Nuevo Producto'} + ' - FarmaControl'">Formulario</title>
    <th:block th:replace="~{fragments/layout :: recursos}" />
    <style>
        .btn-teal { background: #1a838b; color: #fff; border: none; }
        .btn-teal:hover { background: #0e4c5c; color: #fff; }
        .form-label { font-weight: 500; font-size: .875rem; }
    </style>
</head>
<body>
    <nav th:replace="~{fragments/layout :: sidebar('inventario')}"></nav>

    <div class="fc-main">
        <div class="container-fluid py-4 px-4">

            <!-- Título -->
            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/inventario}" class="btn btn-outline-secondary btn-sm me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h4 class="fw-bold mb-0">
                        <i class="bi me-2"
                           th:classappend="${esEdicion ? 'bi-pencil-square' : 'bi-plus-circle'}"></i>
                        <span th:text="${esEdicion ? 'Editar Producto' : 'Registrar Nuevo Producto'}"></span>
                    </h4>
                    <small class="text-muted">Complete los datos del producto</small>
                </div>
            </div>

            <!-- Formulario -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/inventario/guardar}" method="post"
                          th:object="${producto}" novalidate>

                        <!-- ID oculto para edición -->
                        <input type="hidden" th:field="*{idProducto}" />
                        <input type="hidden" th:field="*{activo}" />
                        <input type="hidden" th:field="*{fechaCreacion}" />

                        <div class="row g-3">
                            <!-- Código -->
                            <div class="col-md-4">
                                <label for="codigo" class="form-label">
                                    Código <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="codigo" class="form-control"
                                       th:field="*{codigo}" maxlength="20"
                                       th:classappend="${#fields.hasErrors('codigo') ? 'is-invalid' : ''}"
                                       placeholder="Ej: MED-001">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('codigo')}"
                                     th:errors="*{codigo}">Error</div>
                            </div>

                            <!-- Nombre -->
                            <div class="col-md-8">
                                <label for="nombre" class="form-label">
                                    Nombre del Producto <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="nombre" class="form-control"
                                       th:field="*{nombre}" maxlength="80"
                                       th:classappend="${#fields.hasErrors('nombre') ? 'is-invalid' : ''}"
                                       placeholder="Ej: Paracetamol 500mg">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                                     th:errors="*{nombre}">Error</div>
                            </div>

                            <!-- Categoría -->
                            <div class="col-md-4">
                                <label for="categoria" class="form-label">
                                    Categoría <span class="text-danger">*</span>
                                </label>
                                <select id="categoria" class="form-select"
                                        th:field="*{categoria.idCategoria}"
                                        th:classappend="${#fields.hasErrors('categoria') ? 'is-invalid' : ''}">
                                    <option value="">-- Seleccione --</option>
                                    <option th:each="cat : ${categorias}"
                                            th:value="${cat.idCategoria}"
                                            th:text="${cat.nombre}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('categoria')}"
                                     th:errors="*{categoria}">Error</div>
                            </div>

                            <!-- Precio Venta -->
                            <div class="col-md-4">
                                <label for="precioVenta" class="form-label">
                                    Precio de Venta (S/) <span class="text-danger">*</span>
                                </label>
                                <input type="number" id="precioVenta" class="form-control"
                                       th:field="*{precioVenta}" step="0.01" min="0.01"
                                       th:classappend="${#fields.hasErrors('precioVenta') ? 'is-invalid' : ''}"
                                       placeholder="0.00">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('precioVenta')}"
                                     th:errors="*{precioVenta}">Error</div>
                            </div>

                            <!-- Stock Mínimo -->
                            <div class="col-md-4">
                                <label for="stockMinimo" class="form-label">
                                    Stock Mínimo <span class="text-danger">*</span>
                                </label>
                                <input type="number" id="stockMinimo" class="form-control"
                                       th:field="*{stockMinimo}" min="0"
                                       th:classappend="${#fields.hasErrors('stockMinimo') ? 'is-invalid' : ''}"
                                       placeholder="Ej: 10">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('stockMinimo')}"
                                     th:errors="*{stockMinimo}">Error</div>
                            </div>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/inventario}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg me-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-teal">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="${esEdicion ? 'Actualizar' : 'Registrar'}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <th:block th:replace="~{fragments/layout :: scripts}" />
</body>
</html>
