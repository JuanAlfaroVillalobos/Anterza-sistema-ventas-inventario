<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alertas de Stock Bajo - FarmaControl</title>
    <th:block th:replace="~{fragments/layout :: recursos}" />
    <style>
        .btn-teal { background: #1a838b; color: #fff; border: none; }
        .btn-teal:hover { background: #0e4c5c; color: #fff; }
        .table > thead { background: #f1f5f9; }
        .badge-deficit { background: #fee2e2; color: #991b1b; }
        .progress { height: 8px; border-radius: 4px; }
        .progress-bar-ok { background: #10b981; }
        .progress-bar-low { background: #ef4444; }
    </style>
</head>
<body>
    <nav th:replace="~{fragments/layout :: sidebar('inventario')}"></nav>

    <div class="fc-main">
        <div class="container-fluid py-4 px-4">

            <!-- Encabezado -->
            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/inventario}" class="btn btn-outline-secondary btn-sm me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h4 class="fw-bold mb-0">
                        <i class="bi bi-exclamation-triangle me-2 text-danger"></i>Alertas de Stock Bajo
                    </h4>
                    <small class="text-muted">Productos cuyo stock actual está por debajo del mínimo requerido</small>
                </div>
            </div>

            <!-- Resumen -->
            <div class="alert alert-danger d-flex align-items-center mb-4" role="alert"
                 th:if="${!#lists.isEmpty(productos)}">
                <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
                <div>
                    <strong th:text="${#lists.size(productos)}"></strong> producto(s) con stock por debajo del mínimo.
                    Se requiere reabastecer.
                </div>
            </div>

            <!-- Tabla de productos con stock bajo -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3">Código</th>
                                    <th>Producto</th>
                                    <th>Categoría</th>
                                    <th class="text-center">Stock Actual</th>
                                    <th class="text-center">Stock Mín.</th>
                                    <th class="text-center">Déficit</th>
                                    <th style="min-width:120px">Nivel</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${productos}">
                                    <td class="ps-3 fw-semibold" th:text="${p.codigo}"></td>
                                    <td th:text="${p.nombre}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark"
                                              th:text="${p.categoria.nombre}"></span>
                                    </td>
                                    <td class="text-center fw-bold text-danger"
                                        th:text="${p.stockActual != null ? p.stockActual : 0}"></td>
                                    <td class="text-center" th:text="${p.stockMinimo}"></td>
                                    <td class="text-center">
                                        <span class="badge rounded-pill badge-deficit"
                                              th:text="${'-' + (p.stockMinimo - (p.stockActual != null ? p.stockActual : 0))}"></span>
                                    </td>
                                    <td>
                                        <div class="progress">
                                            <div class="progress-bar progress-bar-low"
                                                 role="progressbar"
                                                 th:style="'width:' + ${p.stockMinimo > 0 ? ((p.stockActual != null ? p.stockActual : 0) * 100 / p.stockMinimo) : 0} + '%'">
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(productos)}">
                                    <td colspan="7" class="text-center text-muted py-4">
                                        <i class="bi bi-check-circle fs-3 d-block mb-2 text-success"></i>
                                        Todos los productos tienen stock suficiente.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <th:block th:replace="~{fragments/layout :: scripts}" />
</body>
</html>
