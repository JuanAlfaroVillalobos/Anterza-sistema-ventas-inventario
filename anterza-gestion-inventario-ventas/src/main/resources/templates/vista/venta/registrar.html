<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="base-url" th:content="@{/}">
    <title>Registrar venta - FarmaControl</title>
    <!-- Bootstrap, Bootstrap Icons y estilos del menú: vienen del layout compartido -->
    <th:block th:replace="~{fragments/layout :: recursos}"></th:block>
</head>
<body>

<!-- Menú lateral compartido -->
<div th:replace="~{fragments/layout :: sidebar(seccion='venta')}"></div>

<main class="fc-main">
    <div class="container-fluid p-4">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="#" class="text-decoration-none">FarmaControl</a></li>
                <li class="breadcrumb-item active" aria-current="page">Registrar Venta</li>
            </ol>
        </nav>

        <h4 class="fw-bold mb-1">Registrar Venta</h4>
        <p class="text-muted small mb-4">Busca los productos, agrégalos a la canasta y procesa la venta.</p>

        <div class="row g-4">

            <!-- ==================== CATÁLOGO ==================== -->
            <section class="col-xl-8" aria-label="Catálogo de productos">

                <!-- Buscador en vivo: no necesita botón -->
                <div class="input-group input-group-lg shadow-sm mb-3">
                    <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
                    <input type="search" id="buscador" class="form-control border-0"
                           placeholder="Buscar por nombre o código del producto..."
                           autocomplete="off" autofocus maxlength="60" aria-label="Buscar producto">
                    <button type="button" id="btnLimpiarBusqueda" class="btn btn-light border-0 d-none"
                            aria-label="Borrar búsqueda">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                <!-- Categorías (vienen de la tabla categoria) -->
                <div class="d-flex flex-wrap gap-2 mb-3" role="radiogroup" aria-label="Categoría">
                    <input type="radio" class="btn-check" name="categoria" id="cat-0" value="0" autocomplete="off" checked>
                    <label class="btn btn-sm btn-outline-dark rounded-pill px-3" for="cat-0">Todos</label>
                    <th:block th:each="c : ${categorias}">
                        <input type="radio" class="btn-check" name="categoria" autocomplete="off"
                               th:id="${'cat-' + c.idCategoria}" th:value="${c.idCategoria}">
                        <label class="btn btn-sm btn-outline-dark rounded-pill px-3"
                               th:for="${'cat-' + c.idCategoria}" th:text="${c.nombre}">Categoría</label>
                    </th:block>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <small class="text-muted" id="contadorResultados" aria-live="polite"
                           th:text="|${#lists.size(productos)} ${#lists.size(productos) == 1 ? 'producto' : 'productos'}|">0 productos</small>
                </div>

                <!-- Mensajes de error de conexión (los pone venta.js) -->
                <div id="estadoBusqueda" class="text-center text-danger py-5 d-none" aria-live="polite"></div>

                <!-- Tarjetas: fragmento reutilizable, el mismo que devuelve /ventas/buscar -->
                <div id="gridProductos" class="row row-cols-1 row-cols-sm-2 row-cols-xxl-3 g-3">
                    <th:block th:replace="~{vista/venta/fragments/producto :: lista}"></th:block>
                </div>
            </section>

            <!-- ==================== CANASTA ==================== -->
            <aside class="col-xl-4" aria-label="Canasta de ventas">
                <div th:replace="~{vista/venta/fragments/canasta :: panel}"></div>
            </aside>
        </div>
    </div>
</main>

<!-- Plantilla de línea de canasta y aviso de venta registrada -->
<template th:replace="~{vista/venta/fragments/canasta :: plantillaLinea}"></template>
<div th:replace="~{vista/venta/fragments/canasta :: modalExito}"></div>

<!-- Bootstrap JS (del layout) y script de la pantalla -->
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/venta.js}"></script>

</body>
</html>
