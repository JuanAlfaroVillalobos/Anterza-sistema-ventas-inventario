<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>

<!--
  Fragmento reutilizable: tarjetas de producto de la pantalla de venta.
  Se usa dos veces:
    1) registrar.html lo incluye al cargar la página,
    2) VentaController#buscar lo devuelve solo (búsqueda en vivo).
  Modelo esperado: ${productos} = List<ProductoVentaDTO>
-->
<th:block th:fragment="lista">

    <!-- Sin resultados -->
    <div class="col-12 text-center text-muted py-5" th:if="${#lists.isEmpty(productos)}">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
        No se encontraron productos.
    </div>

    <!-- Una tarjeta por producto -->
    <div class="col" th:each="p : ${productos}" data-card
         th:with="agotado=${p.stock() <= 0},
                  critico=${p.stock() > 0 and p.stock() * 2 <= p.stockMinimo()},
                  bajo=${p.stock() > 0 and p.stock() * 2 > p.stockMinimo() and p.stock() <= p.stockMinimo()}">
        <article class="card h-100 border-0 shadow-sm" th:classappend="${agotado} ? 'opacity-50'">

            <!-- Foto: static/img/productos/CODIGO.jpg. Si no existe, queda el ícono. -->
            <div class="ratio ratio-16x9 bg-light rounded-top overflow-hidden">
                <div class="d-flex align-items-center justify-content-center text-secondary fs-1">
                    <i class="bi bi-capsule" aria-hidden="true"></i>
                    <img th:src="@{/img/productos/{codigo}.jpg(codigo=${p.codigo()})}" alt="" loading="lazy"
                         class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover bg-white">
                </div>
            </div>

            <div class="card-body d-flex flex-column p-3">
                <h6 class="card-title fw-semibold mb-1" th:text="${p.nombre()}" th:title="${p.nombre()}">Nombre</h6>
                <div class="text-muted small mb-2" th:text="${p.codigo() + ' · ' + p.categoria()}">COD · Categoría</div>

                <div class="d-flex justify-content-between align-items-center mt-auto">
                    <span class="small">
                        <strong th:unless="${agotado}" th:text="|${p.stock()} u.|">10 u.</strong>
                        <span class="badge bg-secondary fw-normal" th:if="${agotado}">Agotado</span>
                        <span class="badge bg-danger fw-normal" th:if="${critico}">Crítico</span>
                        <span class="badge bg-warning text-dark fw-normal" th:if="${bajo}">Bajo stock</span>
                        <span class="badge bg-success fw-normal" th:if="${!agotado and !critico and !bajo}">Stock bueno</span>
                    </span>
                    <span class="fw-bold fs-5"
                          th:text="${'S/ ' + #numbers.formatDecimal(p.precioVenta(), 1, 'POINT', 2, 'POINT')}">S/ 0.00</span>
                </div>

                <!-- Los data-* son los que lee venta.js para armar la canasta -->
                <button type="button" class="btn btn-outline-dark btn-sm w-100 mt-3 js-agregar"
                        th:attr="data-id=${p.idProducto()}, data-codigo=${p.codigo()}, data-nombre=${p.nombre()},
                                 data-precio=${p.precioVenta()}, data-stock=${p.stock()}"
                        th:disabled="${agotado}">
                    <i class="bi bi-plus-lg me-1"></i> Agregar
                </button>
            </div>
        </article>
    </div>

</th:block>

</body>
</html>
