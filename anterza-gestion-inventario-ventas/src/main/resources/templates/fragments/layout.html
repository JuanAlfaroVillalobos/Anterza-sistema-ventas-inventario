<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ==================== FRAGMENT: recursos (CSS) ==================== -->
<th:block th:fragment="recursos">
    <!-- Ícono de la pestaña del navegador (logo de FarmaControl) -->
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/img/favicon.png}">
    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 1.11.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        /* ---- Sidebar fijo (Figma: gradiente rojo oscuro) ---- */
        .fc-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, #1a838b 0%, #0e4c5c 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            z-index: 1040;
            overflow-y: auto;
        }

        .fc-sidebar .nav-link {
            color: rgba(255, 255, 255, .75);
            border-radius: .375rem;
            padding: .55rem .9rem;
            font-size: .875rem;
            transition: background .15s, color .15s;
        }

        .fc-sidebar .nav-link:hover,
        .fc-sidebar .nav-link.active {
            background: rgba(255, 255, 255, .15);
            color: #fff;
        }

        /* ---- Contenido principal desplazado ---- */
        .fc-main {
            margin-left: 250px;
            min-height: 100vh;
            background: #f5f6fa;
        }

        /* ---- Responsivo: en pantallas medianas y pequeñas el menú se oculta y se abre con un botón ---- */
        .fc-toggle,
        .fc-backdrop {
            display: none;
        }

        @media (max-width: 991.98px) {
            .fc-sidebar {
                width: 250px;
                transform: translateX(-100%);
                transition: transform .25s ease;
                box-shadow: none;
            }

            .fc-sidebar.fc-abierto {
                transform: translateX(0);
                box-shadow: 0 0 2rem rgba(0, 0, 0, .35);
            }

            .fc-main {
                margin-left: 0;
                padding-top: 3.25rem;
            }

            .fc-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                position: fixed;
                top: .6rem;
                left: .75rem;
                width: 2.5rem;
                height: 2.5rem;
                z-index: 1050;
                border: 0;
                border-radius: .5rem;
                background: #1a838b;
                color: #fff;
                font-size: 1.3rem;
                box-shadow: 0 .15rem .5rem rgba(0, 0, 0, .25);
            }

            .fc-backdrop.fc-abierto {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 1035;
                background: rgba(0, 0, 0, .45);
            }
        }

        @media (max-width: 575.98px) {
            .fc-main .container-fluid {
                padding-left: .85rem !important;
                padding-right: .85rem !important;
            }
        }
    </style>
</th:block>

<!-- ==================== FRAGMENT: sidebar ==================== -->
<nav th:fragment="sidebar(seccion)" class="fc-sidebar px-3 py-4">

    <!-- Logo / Marca -->
    <div class="text-center mb-4">
        <i class="bi bi-capsule fs-1"></i>
        <h5 class="fw-bold mb-0 mt-1">FarmaControl</h5>
        <small class="text-white-50" style="font-size:.7rem;"></small>
    </div>

    <hr class="border-light opacity-25 my-2">

    <!-- Menú -->
    <ul class="nav flex-column gap-1">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${seccion == 'compra' ? 'active' : ''}" th:href="@{/compras}">
                <i class="bi bi-cart-plus me-2"></i> Registrar Compra
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${seccion == 'inventario' ? 'active' : ''}" th:href="@{/inventario}">
                <i class="bi bi-box-seam me-2"></i> Inventario
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${seccion == 'historial-vencimiento' ? 'active' : ''}"
                th:href="@{/inventario/historial/vencimiento}">
                <i class="bi bi-clock-history me-2"></i> Historial Vencimiento
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${seccion == 'historial-stock' ? 'active' : ''}"
                th:href="@{/inventario/historial/stock}">
                <i class="bi bi-exclamation-triangle me-2"></i> Historial Stock
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${seccion == 'venta' ? 'active' : ''}" th:href="@{/ventas/nueva}">
                <i class="bi bi-receipt me-2"></i> Registrar Venta
            </a>
        </li>
    </ul>

    <!-- Spacer -->
    <div class="mt-auto"></div>

    <!-- Usuario (Figma) -->
    <hr class="border-light opacity-25 my-2">
    <div class="d-flex align-items-center gap-2 px-2 pb-2">
        <div class="rounded-circle bg-white bg-opacity-25 d-flex align-items-center justify-content-center"
            style="width:36px;height:36px;">
            <i class="bi bi-person-fill text-white"></i>
        </div>
        <div>
            <small class="d-block fw-semibold lh-1">Dra. ANGELICA</small>
            <small class="text-white-50" style="font-size:.7rem;">Administradora</small>
        </div>
    </div>
</nav>

<!-- ==================== FRAGMENT: scripts (JS) ==================== -->
<th:block th:fragment="scripts">
    <!-- Bootstrap 5.3.2 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Botón de menú para pantallas pequeñas (se crea solo, las páginas no cambian) -->
    <script>
        (function () {
            var menu = document.querySelector('.fc-sidebar');
            if (!menu) { return; }

            var boton = document.createElement('button');
            boton.type = 'button';
            boton.className = 'fc-toggle';
            boton.setAttribute('aria-label', 'Abrir menú');
            boton.setAttribute('aria-expanded', 'false');
            boton.innerHTML = '<i class="bi bi-list"></i>';

            var fondo = document.createElement('div');
            fondo.className = 'fc-backdrop';

            document.body.appendChild(boton);
            document.body.appendChild(fondo);

            function abrir(abierto) {
                menu.classList.toggle('fc-abierto', abierto);
                fondo.classList.toggle('fc-abierto', abierto);
                boton.setAttribute('aria-expanded', abierto ? 'true' : 'false');
                boton.setAttribute('aria-label', abierto ? 'Cerrar menú' : 'Abrir menú');
            }

            boton.addEventListener('click', function () { abrir(!menu.classList.contains('fc-abierto')); });
            fondo.addEventListener('click', function () { abrir(false); });
            menu.addEventListener('click', function (e) { if (e.target.closest('a')) { abrir(false); } });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { abrir(false); } });
            window.addEventListener('resize', function () { if (window.innerWidth >= 992) { abrir(false); } });
        })();
    </script>
</th:block>

</html>
